<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Арлан Мадрид</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #f59e0b;
            margin-bottom: 20px;
        }

        /* Форма ввода пароля */
        #login-box {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 350px;
            width: 100%;
            margin-top: 50px;
        }

        input[type="password"] {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: white;
            font-size: 16px;
            text-align: center;
        }

        button {
            background-color: #f59e0b;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #d97706;
        }

        #error-msg {
            color: #ef4444;
            margin-top: 10px;
            display: none;
        }

        /* Контент сайта (скрыт до ввода пароля) */
        #protected-content {
            display: none;
            width: 100%;
            max-width: 1000px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #334155;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <!-- Окно авторизации -->
    <div id="login-box">
        <h2>Арлан Мадрид</h2>
        <p>Введите пароль для доступа к галерее:</p>
        <input type="password" id="password-input" placeholder="Пароль">
        <br>
        <button onclick="checkPassword()">Войти</button>
        <p id="error-msg">Неверный пароль!</p>
    </div>

    <!-- Защищенное содержимое -->
    <div id="protected-content">
        <h1>Арлан Мадрид — Галерея</h1>
        <p>Добро пожаловать в приватный архив фотографий.</p>

        <div class="gallery">
            <!-- Добавляйте сюда ваши фото из папки images -->
            <img src="images/photo1.jpg" alt="Фото 1">
            <img src="images/photo2.jpg" alt="Фото 2">
            <img src="images/photo3.jpg" alt="Фото 3">
   <img src="images/photo4.jpg" alt="Фото 4">
        </div>
    </div>

    <script>
        // Установите ваш пароль здесь:
        const CORRECT_PASSWORD = "1234"; 

        function checkPassword() {
            const input = document.getElementById("password-input").value;
            const error = document.getElementById("error-msg");
            const loginBox = document.getElementById("login-box");
            const content = document.getElementById("protected-content");

            if (input === CORRECT_PASSWORD) {
                loginBox.style.display = "none";
                content.style.display = "block";
            } else {
                error.style.display = "block";
            }
        }

        // Вход по нажатию Enter
        document.getElementById("password-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
</body>
</html>
